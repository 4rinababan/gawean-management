name: Build, Test & Deploy Cashflow

on:
  push:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build & Deploy with Docker Compose
        run: docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

      - name: Clean up old images
        run: docker image prune -f