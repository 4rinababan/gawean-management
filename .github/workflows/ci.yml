name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  # Called by the CD workflow so that a deploy runs the exact same build and tests as a PR,
  # rather than a second copy of them that can drift.
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/TaskManagement.Web/package-lock.json

      - name: Build Tailwind CSS
        working-directory: src/TaskManagement.Web
        run: |
          npm ci
          npm run css:build

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:SkipTailwind=true

      - name: Test
        # GitHub-hosted runners include Docker, so the Testcontainers PostgreSQL tests run here.
        run: >
          dotnet test --no-build -c Release -p:SkipTailwind=true
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
