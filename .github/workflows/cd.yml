name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # Nothing reaches production without passing the same suite a pull request has to pass.
  # Reused rather than copied so the two can never drift apart.
  test:
    uses: ./.github/workflows/ci.yml

  build-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # The stack definition is shipped from the repo on every deploy, so the VPS copy can never
      # drift from what is committed. Only .env is VPS-local, because it holds the secrets.
      - name: Ship the stack definition
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile"
          target: /opt/taskmanagement
          strip_components: 1
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/taskmanagement

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export IMAGE="ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # A deploy that leaves the site down must fail loudly rather than report success.
            # The image declares a HEALTHCHECK, so wait for the container to actually report healthy.
            echo "Waiting for the app to become healthy…"
            for _ in $(seq 1 40); do
              cid=$(docker compose -f docker-compose.prod.yml ps -q web)
              status=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)
              [ "$status" = healthy ] && break
              sleep 5
            done

            if [ "$status" != healthy ]; then
              echo "::error::Deploy failed — web is '$status' after 200s. Recent logs:"
              docker compose -f docker-compose.prod.yml logs --tail=80 web
              exit 1
            fi

            echo "Healthy. Deployed $IMAGE"
            docker image prune -f
