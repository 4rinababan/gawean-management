# Production stack for a single VPS: app + PostgreSQL + Caddy (automatic HTTPS).
# The CD workflow runs on a self-hosted GitHub Actions runner installed on this same VPS: it
# builds the image locally and runs this file directly, so there is no registry to pull from.
# Manual use: docker build -t gawean-management:latest .. && docker compose -f docker-compose.prod.yml up -d
services:
  web:
    image: ${IMAGE:-gawean-management:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RunMigrationsOnStartup: "true"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      DataProtection__KeyPath: /keys
      FileStorage__RootPath: /app/uploads
      # Attachments stay on local disk (above) until these are filled in — then S3FileStorage takes
      # over automatically, no other config change needed. Works with any S3-compatible endpoint.
      S3Storage__Endpoint: ${S3_ENDPOINT:-}
      S3Storage__Region: ${S3_REGION:-}
      S3Storage__BucketName: ${S3_BUCKET:-}
      S3Storage__AccessKey: ${S3_ACCESS_KEY:-}
      S3Storage__SecretKey: ${S3_SECRET_KEY:-}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Security: ${SMTP_SECURITY:-Auto}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM:-no-reply@example.com}
      Smtp__FromName: ${SMTP_FROM_NAME:-GaWeAn}
      Ai__Endpoint: ${AI_ENDPOINT:-}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__Model: ${AI_MODEL:-}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      Authentication__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      - keys:/keys
      - uploads:/app/uploads
    expose:
      - "8080"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Nightly pg_dump with rotation, no operator cron needed. Still lives on this one disk — it protects
  # against a bad migration/accidental delete, not against losing the VPS itself (that needs the dumps
  # copied off-host separately).
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - db_backups:/backups

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  db_backups:
  uploads:
  keys:
  caddy_data:
  caddy_config:
